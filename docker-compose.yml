# PostgreSQL per Odoo version, aligned with production from Odoo 20 on.
# The version repo init.sh picks the service and starts it. See readme.md.
x-pg: &pg
  restart: unless-stopped
  command: >
    bash -c "
      if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
        initdb -D /var/lib/postgresql/data/pgdata --username=odoo --pwfile=<(echo odoo);
      fi &&
      grep -qxF 'host all all 0.0.0.0/0 scram-sha-256' /var/lib/postgresql/data/pgdata/pg_hba.conf || echo 'host all all 0.0.0.0/0 scram-sha-256' | tee -a /var/lib/postgresql/data/pgdata/pg_hba.conf &&
      grep -qxF 'host all all ::/0 scram-sha-256' /var/lib/postgresql/data/pgdata/pg_hba.conf || echo 'host all all ::/0 scram-sha-256' | tee -a /var/lib/postgresql/data/pgdata/pg_hba.conf &&
      exec postgres -c listen_addresses='*'
    "
  environment:
    - POSTGRES_USER=odoo
    - POSTGRES_PASSWORD=odoo
    - POSTGRES_DB=postgres
    - PGDATA=/var/lib/postgresql/data/pgdata

services:
  traefik:
    container_name: traefik
    image: traefik:3.6
    command:
        - "--log.level=DEBUG"
        - "--api.insecure=true"
        - "--providers.docker=true"
        - "--providers.docker.exposedbydefault=false"
        - "--entrypoints.web.address=:80"
#        - "--entrypoints.tcp.address=:5432"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    labels:
        - traefik.enable=true
        - traefik.port=8080
        - traefik.frontend.rule=Host:traefik.localhost
        - traefik.http.routers.myservice.rule=Host(`traefik.localhost`)
        - traefik.http.services.myservice.loadbalancer.server.port=8080
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    # para que funcione la solución *.localhost
    # network_mode: "host"
    networks:
      adhoc:
        ipv4_address: 172.60.0.11

  # Every Odoo version up to 19. Not profiled: starts with a plain `up -d`.
  db:
    <<: *pg
    container_name: db
    image: ghcr.io/cloudnative-pg/postgresql:15-standard-bookworm
    ports:
      - 5432:5432
    volumes:
      - ./pg_data:/var/lib/postgresql/data/pgdata
    networks:
      adhoc:
        ipv4_address: 172.60.0.4

  # Odoo 20 and master.
  db17:
    <<: *pg
    profiles: [pg17]
    container_name: db17
    image: ghcr.io/cloudnative-pg/postgresql:17-standard-bookworm
    ports:
      - 5417:5432
    volumes:
      - ./pg_data_v17:/var/lib/postgresql/data/pgdata
    networks:
      adhoc:
        ipv4_address: 172.60.0.117

  kwkhtmltopdf:
    depends_on:
      - dns
    container_name: kwkhtmltopdf
    image: ghcr.io/acsone/kwkhtmltopdf:0.12.6.1-latest
    restart: on-failure
    dns:
      - "172.60.0.10"
    networks:
      adhoc:
        ipv4_address: 172.60.0.5

  # aeroo:
  #   container_name: aeroo
  #   image: adhoc/aeroo-docs:9.7
  #   restart: on-failure
  #   networks:
  #     adhoc:
  #       ipv4_address: 172.60.0.3

  # mailhog:
  #   container_name: mailhog
  #   image: mailhog/mailhog:latest
  #   restart: on-failure
  #   ports:
  #     - 8025:8025
  #   #   - 1025:1025
  #   networks:
  #     adhoc:
  #       ipv4_address: 172.60.0.2

  dns:
    container_name: dns
    image: cytopia/bind:alpine-0.30
    restart: unless-stopped
    environment:
      DNS_A: "*.odoo.localhost=172.60.0.11,*.adhoc.devops=${MINIKUBE_IP},*.cluster.local=${MINIKUBE_IP}"
      DNS_FORWARDER: 127.0.0.11,8.8.8.8,8.8.4.4
    networks:
      adhoc:
        ipv4_address: 172.60.0.10

networks:
  adhoc:
    external: true
  minikube:
    name: minikube
    external: true
